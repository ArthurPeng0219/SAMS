<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>技能证书</title>
    <link rel="stylesheet" href="/css/pages/certificates.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/layout.css">
</head>
<body>
<main class="main">

    <section class="page-header">
        <div>
            <h1>
                技能证书
            </h1>
            <p>
                管理你的专业技能和资格证书
            </p>
        </div>

        <button class="primary-button">
            +添加证书
        </button>
    </section>

    <section class="statistic">
        <div class="stat-card">
            <div class="stat-title">
                证书总数
            </div>
            <div class="stat-number">
                8
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-title">
                计算机类
            </div>

            <div class="stat-number">
                3
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-title">
                英语类
            </div>

            <div class="stat-number">
                2
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-title">
                专业类
            </div>

            <div class="stat-number">
                3
            </div>
        </div>
    </section>


    <section class="certificate-grid">

        <!--证书1-->
        <article class="certificate-card">
            <div class="certificate-header">
                <div class="certificate-icon">
                    C
                </div>
                <span class="certificate-status">
                    已获得
                </span>
            </div>

            <h2>
                全国计算机等级考试二级
            </h2>

            <p class="certificate-type">
                计算机类
            </p>
            <div class="certificate-info">
                <div>
                    <span>颁发机构</span>
                    <strong>教育部考试中心</strong>
                </div>

                <div>
                    <span>获得时间</span>
                    <strong>2026-03</strong>
                </div>

                <div>
                    <span>证书编号</span>
                    <strong>XXXXXXXX</strong>
                </div>
            </div>

            <div class="certificate-actions">
                <button>查看</button>
                <button>编辑</button>
                <button>删除</button>
            </div>

        </article>

        <!-- 证书 2 -->
        <article class="certificate-card">

            <div class="certificate-header">

                <div class="certificate-icon">
                    E
                </div>

                <span class="certificate-status">
                    已获得
                </span>

            </div>


            <h2>
                大学英语六级
            </h2>


            <p class="certificate-type">
                英语类
            </p>


            <div class="certificate-info">

                <div>
                    <span>考试成绩</span>
                    <strong>
                        520
                    </strong>
                </div>


                <div>
                    <span>获得时间</span>
                    <strong>
                        2026-06
                    </strong>
                </div>


                <div>
                    <span>证书编号</span>
                    <strong>
                        XXXXXXXX
                    </strong>
                </div>

            </div>


            <div class="certificate-actions">

                <button>
                    查看
                </button>

                <button>
                    编辑
                </button>

                <button>
                    删除
                </button>

            </div>

        </article>


        <!-- 证书 3 -->
        <article class="certificate-card">

            <div class="certificate-header">

                <div class="certificate-icon">
                    P
                </div>

                <span class="certificate-status">
                    已获得
                </span>

            </div>


            <h2>
                Python相关技能认证
            </h2>


            <p class="certificate-type">
                专业类
            </p>


            <div class="certificate-info">

                <div>
                    <span>认证机构</span>
                    <strong>
                        专业认证机构
                    </strong>
                </div>


                <div>
                    <span>获得时间</span>
                    <strong>
                        2026-05
                    </strong>
                </div>


                <div>
                    <span>证书编号</span>
                    <strong>
                        XXXXXXXX
                    </strong>
                </div>

            </div>


            <div class="certificate-actions">

                <button>
                    查看
                </button>

                <button>
                    编辑
                </button>

                <button>
                    删除
                </button>

            </div>

        </article>


    </section>
</main>
</body>
</html>
