<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>荣誉档案 - 学生个人档案管理系统</title>

    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/honors.css">

</head>


<body>

<div class="app">

    <!-- Header -->
    <header class="header">

        <div class="logo">
            学生个人档案管理系统
        </div>

        <div class="user-info">

            <span>Arthur</span>

            <span class="avatar">
                A
            </span>

        </div>

    </header>


    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <nav class="menu">

                <a href="index.html"
                   class="menu-item">
                    首页
                </a>

                <a href="profile.html"
                   class="menu-item">
                    个人信息
                </a>

                <a href="grades.html"
                   class="menu-item">
                    学习档案
                </a>

                <a href="honors.html"
                   class="menu-item active">
                    荣誉档案
                </a>

                <a href="certificates.html"
                   class="menu-item">
                    技能证书
                </a>

                <a href="courses.html"
                   class="menu-item">
                    课程资料
                </a>

                <a href="practice.html"
                   class="menu-item">
                    实践档案
                </a>

                <a href="resume.html"
                   class="menu-item">
                    求职档案
                </a>

                <a href="growth.html"
                   class="menu-item">
                    成长分析
                </a>

                <a href="settings.html"
                   class="menu-item">
                    系统管理
                </a>

            </nav>

        </aside>


        <!-- Main -->
        <main class="main">
            <!--页面标题-->
            <section class="page-header">
                <div>
                    <h1>
                        荣誉档案
                    </h1>

                    <p>
                        记录大学期间获得的奖项、荣誉和比赛成果
                    </p>

                    <button class="primary-button">
                        + 添加荣誉
                    </button>
                </div>
            </section>

            <section class="statistics">

                <div class="card stat-card">
                    总荣誉
                </div>

                <div class="card stat-card">

                    <div class="stat-title">
                        校级荣誉
                    </div>

                    <div class="stat-number">
                        5
                    </div>
                </div>

                <div class="card stat-card">

                    <div class="stat-title">
                        院级荣誉
                    </div>

                    <div class="stat-number">
                        4
                    </div>

                </div>

                <div class="card stat-card">

                    <div class="stat-title">
                        比赛奖项
                    </div>

                    <stat-number>
                        3
                    </stat-number>
                </div>

            </section>

            <!--分类-->

            <section class="filter-panel">

                <button class="filter-item active">
                    全部
                </button>

                <button class="filter-item">
                    奖学金
                </button>

                <button class="filter-item">
                    比赛
                </button>

                <button class="filter-item">
                    荣誉
                </button>

                <button class="filter=item">
                    其他
                </button>
            </section>

            <!--荣誉列表-->

            <section class="honor-grid">

                <!--荣誉卡片1-->

                <article class=" card honor-card">

                    <div class="honor-card-top">

                        <div class="honor-icon">
                            奖
                        </div>

                        <span class="honor-type">
                        奖学金
                    </span>
                    </div>

                    <div class="honor-content">

                        <h2>
                            优秀学生奖学金
                        </h2>

                        <p>
                            因学习成绩优秀，获得学校优秀学生奖学金。
                        </p>

                    </div>

                    <div class="honor-meta">

                        <span>
                            校级
                        </span>

                        <span>
                            2026-06
                        </span>
                    </div>

                        <div class="honor-actions">

                            <button>
                                编辑
                            </button>

                            <button>
                                删除
                            </button>
                        </div>

                </article>

                    <!--荣誉卡片2-->

                    <article class=" card honor-card">

                        <div class="honor-card-top">

                            <div class="honor-icon">
                                奖
                            </div>

                            <span class="honor-type">
                                比赛
                            </span>

                        </div>

                        <div class="honor-content">

                            <h2>
                                大学生创新创业项目
                            </h2>

                            <p>
                                参加YOLO项目
                            </p>
                        </div>

                        <div class="honor-meta">

                            <span>
                                校级
                            </span>

                            <span>
                                2026-05
                            </span>
                        </div>

                        <div class="honor-actions">

                            <button>
                                编辑
                            </button>

                            <button>
                                删除
                            </button>
                        </div>
                    </article>

                <!-- 荣誉卡片 3 -->
                <article class=" card honor-card">

                    <div class="honor-card-top">

                        <div class="honor-icon">
                            荣
                        </div>

                        <span class="honor-type">
                            荣誉
                        </span>

                    </div>


                    <div class="honor-content">

                        <h2>
                            优秀志愿者
                        </h2>

                        <p>
                            参与校园志愿服务活动并获得优秀志愿者称号。
                        </p>

                    </div>


                    <div class="honor-meta">

                        <span>
                            院级
                        </span>

                        <span>
                            2026-04
                        </span>

                    </div>


                    <div class="honor-actions">

                        <button>
                            编辑
                        </button>

                        <button>
                            删除
                        </button>

                    </div>

                </article>

            </section>
        </main>


    </div>

</div>

</body>

</html>
