<html lang="en">

    <meta charset="UTF-8">

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">

</head>
<body>
<div class="layout">

<aside class="sidebar">

    <nav class="menu">

        <a href="index.html"
           class="menu-item">

        <a href="profile.html"
           class="menu-item">

        <a href="grades.html"
           class="menu-item">

        <a href="honors.html"
           class="menu-item">

        <a href="certificates.html"
           class="menu-item">

        <a href="courses.html"

        <a href="practice.html"
           class="menu-item">

        <a href="resume.html"
           class="menu-item">

            成长分析
        </a>

        <a href="settings.html"
           class="menu-item">
            系统管理
        </a>

    </nav>

</aside>

<main class="main">

    <section class="page-header">

        <div>
            <h1>学习档案</h1>

            <p>
                查看和管理你的历史课程成绩
            </p>
        </div>

    </section>


    <!-- 统计 -->
    <section class="statistics">

        <div class=" card stat-card">

            <div class="stat-title">
                平均成绩
            </div>

            <div class="stat-number">
                86.5
            </div>

        </div>


        <div class="card stat-card">

            <div class="stat-title">
                最高成绩
            </div>

            <div class="stat-number">
                98
            </div>

        </div>


        <div class="card stat-card">

            <div class="stat-title">
                已修课程
            </div>

            <div class="stat-number">
                24
            </div>

        </div>


        <div class="card stat-card">

            <div class="stat-title">
                总学分
            </div>

            <div class="stat-number">
                52
            </div>

        </div>

    </section>


    <!-- 成绩表 -->
    <section class="panel">

        <div class="panel-header">

            <h2>历史成绩</h2>

            <input
                    class="search-input"
                    type="text"
                    placeholder="搜索课程"
            >

        </div>


        <div class="table-wrapper">

            <table class="data-table">

                <thead>

                <tr>
                    <th>课程</th>
                    <th>学期</th>
                    <th>学分</th>
                    <th>成绩</th>
                    <th>状态</th>
                </tr>

                </thead>


                <tbody>

                <tr>
                    <td>Java程序设计</td>
                    <td>大二上</td>
                    <td>3</td>
                    <td>92</td>
                    <td>
                        <span class="status success">
                            优秀
                        </span>
                    </td>
                </tr>


                <tr>
                    <td>Python数据分析</td>
                    <td>大二上</td>
                    <td>3</td>
                    <td>88</td>
                    <td>
                        <span class="status good">
                            良好
                        </span>
                    </td>
                </tr>


                <tr>
                    <td>数据库原理</td>
                    <td>大二上</td>
                    <td>3</td>
                    <td>90</td>
                    <td>
                        <span class="status success">
                            优秀
                        </span>
                    </td>
                </tr>


                <tr>
                    <td>机器学习</td>
                    <td>大二下</td>
                    <td>3</td>
                    <td>85</td>
                    <td>
                        <span class="status good">
                            良好
                        </span>
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>
    </div>
</body>
</html>
