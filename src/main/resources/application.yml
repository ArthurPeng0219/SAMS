server:
  port: 8080

spring:
  application:
    name: sams
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/sams?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: arthur
  jpa:
    hibernate:
      # update：自动根据实体建表/加字段（学习阶段方便；生产建议用 none + migration 工具）
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  web:
    resources:
      static-locations: classpath:/static/

logging:
  level:
    com.arthur.sams: debug
